##################### код взят с ютуба https://www.youtube.com/watch?v=W6zkxnmmznI&list=WL&index=36&ab_channel=pyctech
 #Turn 90°
#button:
  - platform: template
    name: "Turn 90°"
    on_press:
      then:
          - logger.log: Button Pressed
          - stepper.report_position:
              id: my_stepper
              position: 0          
          - stepper.set_target:
              id: my_stepper
              target: 500

# Example configuration entry
stepper:
  - platform: uln2003
    id: my_stepper
    pin_a: GPIOXX
    pin_b: GPIOXX
    pin_c: GPIOXX
    pin_d: GPIOXX
    max_speed: 250 steps/s

    # Optional:
    acceleration: inf
    deceleration: inf
    sleep_when_done: True


cover:
  - platform: template
    name: "Template Cover"
    open_action:  
      - stepper.set_target:
          id: my_stepper
          target: 2000
    close_action:
      - stepper.set_target:
          id: my_stepper
          target: 0
    stop_action:   
      - stepper.set_target:
          id: my_stepper
          target: !lambda |-
            return id(my_stepper).current_position;
    optimistic: true
