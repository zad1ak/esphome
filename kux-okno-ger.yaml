# ===================== ОСНОВНЫЕ НАСТРОЙКИ ESPHome =====================

substitutions:
  # Имя устройства и описание
  device_name: "kux-okno-ger"
  friendly_name: "Умный ночник с лентой"
  project_name: "Умный ночник v1"
  
  # Настройки светодиодной ленты
  led_pin: GPIO4        # Пин D2 на NodeMCU (подходит для WS2812B)
  num_leds: "300"          # Количество светодиодов в ленте

# ===================== НАСТРОЙКИ ПРОШИВКИ =====================

esphome:
  name: ${device_name}
  comment: ${project_name}

# ===================== ПЛАТФОРМА ESP8266 =====================

esp8266:
  board: nodemcuv2       # NodeMCU v2 (ESP-12E)

# ===================== WIFI =====================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Добавьте эту строку, чтобы установить минимальный режим аутентификации
  #min_auth_mode: WPA2 # Используйте WPA2 для повышения безопасности  
  
  # Точка доступа, если подключение к WiFi невозможно
  ap:
    ssid: "${device_name}_AP"
    password: !secret AP

# Веб-сервер ESPHome для локального управления
web_server:
  #port: 80
  # auth:    # Включите при необходимости защиты
  #   username: admin
  #   password: !secret API

# API для Home Assistant
api:
  encryption:
    key: !secret API

# OTA обновления прошивки
ota:
  - platform: esphome
    password: !secret OTA

# Логирование в последовательный порт
logger:
  level: DEBUG

# ===================== ВРЕМЯ =====================

time:
  - platform: sntp
    id: sntp_time
    timezone: "Asia/Yekaterinburg"
    on_time:
      # Авто-выключение в 8:00 каждый день (формат cron: сек, мин, час, день, месяц, день недели)
      - cron: '0 0 8 * * *'
        then:
          - light.turn_off: led_strip

# ===================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ =====================

globals:
  # Текущее значение освещённости
  - id: light_level
    type: int
    restore_value: no
    initial_value: '0'
  
  # Порог освещённости для ночного режима
  - id: night_threshold
    type: int
    restore_value: yes
    initial_value: '100'

# ===================== ДАТЧИКИ =====================

sensor:

  # Фоторезистор на ADC0
  - platform: adc
    pin: A0
    id: photoresistor
    name: "${friendly_name} Освещенность"
    update_interval: 2s
    filters:
      # Преобразование в проценты (0–100)
      - lambda: |-
          return (x / 1.0) * 100;
    on_value:
      then:
        - lambda: |-
            id(light_level) = x;

            // Автоматическое определение "темно/светло"
            if (x > id(night_threshold)) {
              id(motion_night).publish_state(true);
            } else {
              id(motion_night).publish_state(false);
            }

  # Сенсор отображает текущий порог освещённости в интерфейсе
  - platform: template
    id: light_threshold_sensor
    name: "${friendly_name} Порог освещенности"
    lambda: |-
      return id(night_threshold);
    on_value:
      then:
        - lambda: |-
            id(night_threshold) = x;

  # Уровень WiFi сигнала RSSI
  - platform: wifi_signal
    name: "${friendly_name} WiFi сигнал"
    update_interval: 60s

# ===================== ДАТЧИК ДВИЖЕНИЯ =====================

binary_sensor:
  - platform: gpio
    id: motion_night
    name: "${friendly_name} Движение (ночник)"
    pin:
      number: GPIO12   # D6 на NodeMCU (подходит для PIR)
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
    on_press:
      then:
        - if:
            condition:
              lambda: |-
                return id(light_level) > id(night_threshold);
            then:
              - light.turn_on:
                  id: led_strip
                  brightness: 20%
                  transition_length: 3s
    on_release:
      then:
        - delay: 30s
        - light.turn_off:
            id: led_strip
            transition_length: 10s

# ===================== УПРАВЛЕНИЕ ЛЕНТОЙ =====================

light:
  - platform: neopixelbus
    id: led_strip
    name: "${friendly_name} Лента"
    type: GRB              # Формат WS2812B
    variant: WS2812
    pin: ${led_pin}
    num_leds: ${num_leds}

    effects:

      # Случайные цвета
      - random:
          name: "Случайные цвета"
          transition_length: 2s
          update_interval: 2s

      # Эффект радуги
      - addressable_rainbow:
          name: "Радуга"
          speed: 50
          width: 50

      # Статический цвет (цвет задается через API)
      - addressable_lambda:
          name: "Статический цвет"
          update_interval: 0s
          lambda: |-
            for (auto &&led : it) {
              // Цвет устанавливается через light.turn_on(...)
            }

      # Пульсация
      - pulse:
          name: "Пульсация"
          transition_length: 500ms
          update_interval: 1s

      # Мерцание
      - flicker:
          name: "Мерцание"
          alpha: 0.8
          intensity: 0.3

    default_transition_length: 0.5s

# ===================== КНОПКИ/ПЕРЕКЛЮЧАТЕЛИ =====================

switch:

  # Включение/выключение ленты
  - platform: template
    id: toggle_light
    name: "${friendly_name} Переключить свет"
    turn_on_action:
      - light.turn_on: led_strip
    turn_off_action:
      - light.turn_off: led_strip

  # Перезагрузка устройства
  - platform: restart
    id: restart_device
    name: "${friendly_name} Перезагрузить"

# ===================== СЛАЙДЕРЫ =====================

number:

  # Яркость
  - platform: template
    id: brightness_control
    name: "${friendly_name} Яркость"
    min_value: 1
    max_value: 100
    step: 1
    mode: slider
    optimistic: true
    on_value:
      then:
        - light.turn_on:
            id: led_strip
            brightness: !lambda 'return x / 100.0;'

  # Скорость эффектов
  - platform: template
    id: speed_control
    name: "${friendly_name} Скорость эффектов"
    min_value: 1
    max_value: 100
    step: 1
    mode: slider
    optimistic: true
    unit_of_measurement: "%"
    on_value:
      then:
        - lambda: |-
            if (id(led_strip).get_effect_name() == "Радуга") {
              id(led_strip).make_call()
                .set_effect("Радуга")
                .perform();
            }

# ===================== ВЫБОР ЦВЕТА И ЭФФЕКТА =====================

select:

  # Выбор цвета
  - platform: template
    id: color_select
    name: "${friendly_name} Цвет"
    optimistic: true
    options:
      - "Красный"
      - "Зеленый"
      - "Синий"
      - "Белый"
      - "Желтый"
      - "Фиолетовый"
      - "Голубой"
      - "Оранжевый"
      - "Розовый"
    on_value:
      then:
        - lambda: |-
            auto call = id(led_strip).turn_on();

            if (x == "Красный")       call.set_rgb(1, 0, 0);
            else if (x == "Зеленый")  call.set_rgb(0, 1, 0);
            else if (x == "Синий")    call.set_rgb(0, 0, 1);
            else if (x == "Белый")    call.set_rgb(1, 1, 1);
            else if (x == "Желтый")   call.set_rgb(1, 1, 0);
            else if (x == "Фиолетовый") call.set_rgb(1, 0, 1);
            else if (x == "Голубой")  call.set_rgb(0, 1, 1);
            else if (x == "Оранжевый") call.set_rgb(1, 0.5, 0);
            else if (x == "Розовый") call.set_rgb(1, 0.75, 0.8);

            call.set_effect("Статический цвет");
            call.perform();

  # Выбор эффекта
  - platform: template
    id: effect_select
    name: "${friendly_name} Эффект"
    optimistic: true
    options:
      - "Статический цвет"
      - "Случайные цвета"
      - "Радуга"
      - "Пульсация"
      - "Мерцание"
      - "Бегущие огни"
      - "Огонь"
    on_value:
      then:
        - lambda: |-
            id(led_strip).make_call()
              .set_effect(x)
              .perform();

# ===================== ДОПОЛНИТЕЛЬНЫЕ КНОПКИ =====================

button:

  # Случайный цвет
  - platform: template
    name: "${friendly_name} Случайный цвет"
    icon: "mdi:palette"
    on_press:
      then:
        - light.turn_on:
            id: led_strip
            effect: "Статический цвет"
            red: !lambda 'return random(0, 256) / 255.0;'
            green: !lambda 'return random(0, 256) / 255.0;'
            blue: !lambda 'return random(0, 256) / 255.0;'
            brightness: 80%

  # Случайный эффект
  - platform: template
    name: "${friendly_name} Случайный эффект"
    icon: "mdi:dice-5"
    on_press:
      then:
        - lambda: |-
            static const std::vector<std::string> effects = {
              "Случайные цвета",
              "Радуга",
              "Пульсация",
              "Мерцание",
              "Бегущие огни",
              "Огонь"
            };
            int index = random(0, effects.size());
            id(led_strip).make_call()
              .set_effect(effects[index])
              .set_brightness(0.7)
              .perform();

# ===================== ТЕКСТОВЫЕ СЕНСОРЫ =====================

text_sensor:

  # IP-адрес устройства
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Адрес"

  # Версия прошивки ESPHome
  - platform: version
    name: "${friendly_name} Версия"
