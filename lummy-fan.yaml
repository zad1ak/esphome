# =========================================================
# Lummy LU-FN105 — полная конфигурация для Wemos D1 Mini
# Версия: 1.0.2
# =========================================================

substitutions:
  name: lummy-fan
  project_version: "1.0.2"
  
  # ---------- Пины Wemos D1 Mini ----------
  # Подключите эти пины к тактовым кнопкам вентилятора.
  # Кнопки без фиксации, замыкаются на GND при нажатии.
  # Можно изменить на другие свободные GPIO.
  pin_mode: D1    # GPIO5 — кнопка MODE
  pin_timer: D2   # GPIO4 — кнопка TIMER
  pin_speed: D5   # GPIO14 — кнопка ON/SPEED
  pin_off: D6     # GPIO12 — кнопка OFF

esphome:
  name: ${name}
  name_add_mac_suffix: false

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret AP

captive_portal:

api:
  encryption:
    key: !secret API

ota:
  platform: esphome
  password: !secret OTA

logger:

# ---------- Глобальные переменные состояния ----------
# Используются для отслеживания "предполагаемого" состояния,
# так как обратной связи от вентилятора нет.
globals:
  - id: g_speed
    type: int
    restore_value: true
    initial_value: '0'   # 0=выкл, 1=low, 2=med, 3=high
  - id: g_mode
    type: int
    restore_value: true
    initial_value: '0'   # 0=нет режима, 1=normal, 2=wind
  - id: g_timer_idx
    type: int
    restore_value: true
    initial_value: '0'   # 0=выкл, 1=0.5ч, 2=1ч, ..., 15=7.5ч
  - id: g_presses_remaining
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_temp_target
    type: int
    restore_value: false
    initial_value: '0'

# ---------- Выходы на кнопки (имитация нажатия) ----------
output:
  - platform: gpio
    pin: ${pin_mode}
    id: out_btn_mode
  - platform: gpio
    pin: ${pin_timer}
    id: out_btn_timer
  - platform: gpio
    pin: ${pin_speed}
    id: out_btn_speed
  - platform: gpio
    pin: ${pin_off}
    id: out_btn_off

# ---------- Переключатели для импульсного управления ----------
# internal: true — скрыты из Home Assistant
switch:
  - platform: output
    id: sw_btn_mode
    output: out_btn_mode
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: output
    id: sw_btn_timer
    output: out_btn_timer
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: output
    id: sw_btn_speed
    output: out_btn_speed
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: output
    id: sw_btn_off
    output: out_btn_off
    restore_mode: ALWAYS_OFF
    internal: true

# ---------- Скрипты имитации одиночного нажатия ----------
script:
  - id: press_mode
    mode: single
    then:
      - switch.turn_on: sw_btn_mode
      - delay: 150ms
      - switch.turn_off: sw_btn_mode

  - id: press_timer
    mode: single
    then:
      - switch.turn_on: sw_btn_timer
      - delay: 150ms
      - switch.turn_off: sw_btn_timer

  - id: press_speed
    mode: single
    then:
      - switch.turn_on: sw_btn_speed
      - delay: 150ms
      - switch.turn_off: sw_btn_speed

  - id: press_off
    mode: single
    then:
      - switch.turn_on: sw_btn_off
      - delay: 150ms
      - switch.turn_off: sw_btn_off

  # ---------- Скрипт установки скорости вентилятора ----------
  # При выключенном вентиляторе сначала включает (LOW),
  # затем нажимает SPEED нужное количество раз.
  - id: set_fan_speed
    mode: queued
    parameters:
      target: int
    then:
      - lambda: |-
          int current = id(g_speed);
          if (current == 0) {
            // Вентилятор выключен — включаем (становится LOW)
            id(press_speed).execute();
            id(g_speed) = 1;
            current = 1;
          }
          int presses = (target - current + 3) % 3;
          if (presses == 0) {
            id(g_presses_remaining) = 0;
          } else {
            id(g_presses_remaining) = presses;
          }
      - while:
          condition:
            lambda: 'return id(g_presses_remaining) > 0;'
          then:
            - script.execute: press_speed
            - delay: 300ms
            - lambda: |-
                id(g_presses_remaining)--;
                // Циклическое переключение: 1->2->3->1
                id(g_speed) = (id(g_speed) % 3) + 1;

  # ---------- Скрипт установки режима ----------
  # Логика кнопки MODE: Normal -> Wind -> Off -> Normal
  - id: set_fan_mode
    mode: queued
    parameters:
      target: int
    then:
      - lambda: |-
          int current = id(g_mode);
          if (current == target) {
            id(g_presses_remaining) = 0;
            return;
          }
          // Вычисляем количество нажатий по циклу (0->1->2->0)
          int presses = (target - current + 3) % 3;
          id(g_presses_remaining) = presses;
      - while:
          condition:
            lambda: 'return id(g_presses_remaining) > 0;'
          then:
            - script.execute: press_mode
            - delay: 300ms
            - lambda: |-
                id(g_presses_remaining)--;
                id(g_mode) = (id(g_mode) + 1) % 3;

  # ---------- Скрипт установки таймера ----------
  # Логика кнопки TIMER: цикл 0.5->1->...->7.5->Off->0.5
  - id: set_fan_timer
    mode: queued
    parameters:
      target: int
    then:
      - lambda: |-
          int current = id(g_timer_idx);
          if (current == target) {
            id(g_presses_remaining) = 0;
            return;
          }
          int presses = (target - current + 16) % 16;
          id(g_presses_remaining) = presses;
      - while:
          condition:
            lambda: 'return id(g_presses_remaining) > 0;'
          then:
            - script.execute: press_timer
            - delay: 300ms
            - lambda: |-
                id(g_presses_remaining)--;
                id(g_timer_idx) = (id(g_timer_idx) + 1) % 16;

# ---------- Вентилятор (3 скорости) ----------
fan:
  - platform: template
    name: "Вентилятор"
    id: fan_lummy
    speed_count: 3
    # Включение: если выключен — имитируем ON/SPEED (включается на LOW)
    on_turn_on:
      - lambda: |-
          if (id(g_speed) == 0) {
            id(press_speed).execute();
            id(g_speed) = 1;
          }
    # Выключение: имитируем кнопку OFF
    on_turn_off:
      - script.execute: press_off
      - globals.set:
          id: g_speed
          value: '0'
    # Установка скорости: low/med/high
    on_speed_set:
      - lambda: |-
          int target = 0;
          auto speed = id(fan_lummy).speed;
          if (speed == 1) target = 1;        // LOW
          else if (speed == 2) target = 2;   // MEDIUM
          else if (speed == 3) target = 3;   // HIGH
          id(g_temp_target) = target;
      - script.execute:
          id: set_fan_speed
          target: !lambda 'return id(g_temp_target);'

# ---------- Выбор режима работы ----------
select:
  - platform: template
    name: "Режим"
    id: sel_mode
    options:
      - "Выключен"
      - "Нормальный"
      - "Имитация ветра"
    initial_option: "Выключен"
    optimistic: true
    # При изменении выбора имитируем нужное количество нажатий MODE
    on_value:
      then:
        - lambda: |-
            int target = 0;
            if (x == "Нормальный") target = 1;
            else if (x == "Имитация ветра") target = 2;
            id(g_temp_target) = target;
        - script.execute:
            id: set_fan_mode
            target: !lambda 'return id(g_temp_target);'

# ---------- Выбор таймера (числовое значение) ----------
number:
  - platform: template
    name: "Таймер"
    id: num_timer
    min_value: 0
    max_value: 7.5
    step: 0.5
    initial_value: 0
    optimistic: true
    unit_of_measurement: "ч"
    # При изменении имитируем нужное количество нажатий TIMER
    on_value:
      then:
        - lambda: |-
            int target = round(x / 0.5);  // 0..15
            id(g_temp_target) = target;
        - script.execute:
            id: set_fan_timer
            target: !lambda 'return id(g_temp_target);'

# ---------- Кнопки для ручной имитации физических нажатий ----------
# Полезны для отладки или если логика состояния рассинхронизировалась
button:
  - platform: template
    name: "Кнопка MODE (физ)"
    on_press:
      - script.execute: press_mode
      - lambda: |-
          // Обновляем предполагаемое состояние по циклу
          id(g_mode) = (id(g_mode) + 1) % 3;
  - platform: template
    name: "Кнопка TIMER (физ)"
    on_press:
      - script.execute: press_timer
      - lambda: |-
          id(g_timer_idx) = (id(g_timer_idx) + 1) % 16;
  - platform: template
    name: "Кнопка ON-SPEED (физ)"
    on_press:
      - script.execute: press_speed
      - lambda: |-
          if (id(g_speed) == 0) id(g_speed) = 1;
          else id(g_speed) = (id(g_speed) % 3) + 1;
  - platform: template
    name: "Кнопка OFF (физ)"
    on_press:
      - script.execute: press_off
      - globals.set:
          id: g_speed
          value: '0'
  # ---------- Перезагрузка ----------
  - platform: restart
    name: "Перезагрузка"

# ---------- Сенсоры и диагностика ----------
sensor:
  # --- Uptime (сырое значение в секундах, скрыто) ---
  - platform: uptime
    name: "Время работы (raw)"
    id: uptime_sensor
    update_interval: 60s
    internal: true

  # --- Уровень сигнала WiFi ---
  - platform: wifi_signal
    name: "Уровень WiFi"
    update_interval: 60s

text_sensor:
  # --- Время работы в человекочитаемом формате ---
  - platform: template
    name: "Время работы"
    id: uptime_human
    icon: mdi:timer-outline
    lambda: |-
      int seconds = round(id(uptime_sensor).get_raw_state());
      int days = seconds / (24 * 3600);
      seconds = seconds % (24 * 3600);
      int hours = seconds / 3600;
      seconds = seconds % 3600;
      int minutes = seconds / 60;
      seconds = seconds % 60;
      std::string result = "";
      if (days > 0) result += to_string(days) + "д ";
      if (hours > 0) result += to_string(hours) + "ч ";
      if (minutes > 0) result += to_string(minutes) + "м ";
      result += to_string(seconds) + "с";
      return result;
    update_interval: 60s

  # --- IP-адрес и SSID ---
  - platform: wifi_info
    ip_address:
      name: "IP адрес"
    ssid:
      name: "WiFi сеть"

  # --- Версия прошивки ---
  - platform: template
    name: "Версия прошивки"
    icon: mdi:tag-outline
    lambda: |-
      return {"${project_version}"};
    update_interval: 60s
