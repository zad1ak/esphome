# =============================================
# ESPHome прошивка для вентилятора Lummy LU-FN105
# Управление через Wemos D1 Mini
# Автор: zad1ak
# Репозиторий: https://github.com/zad1ak/esphome
# =============================================

# -------------------- ОСНОВНЫЕ НАСТРОЙКИ УСТРОЙСТВА --------------------
esphome:
  name: lummy-fan                      # Уникальное имя устройства в сети
  friendly_name: Lummy Fan             # Отображаемое имя в Home Assistant
  comment: "LU-FN105 Smart Fan"        # Комментарий для идентификации
  # Подключаем внешний заголовочный файл с классом управления вентилятором
  includes:
    - fan_controller.h                 # Файл должен лежать в той же папке
  # Действия при загрузке устройства
  on_boot:
    - priority: -100                   # Низкий приоритет, чтобы выполнить после инициализации
      then:
        - lambda: |-
            # Запоминаем время запуска для подсчета времени работы
            id(fan_start_time) = millis();

# -------------------- АППАРАТНАЯ ПЛАТФОРМА --------------------
# Используем плату Wemos D1 Mini на базе ESP8266
esp8266:
  board: d1_mini                      # Тип платы

# -------------------- СЛУЖЕБНЫЕ КОМПОНЕНТЫ --------------------
# Включение логирования для отладки
logger:

# Настройка API для связи с Home Assistant
api:
  encryption:
    key: !secret API                   # Ключ шифрования из секретов

# -------------------- ИСПРАВЛЕННАЯ НАСТРОЙКА OTA --------------------
# Настройка OTA для беспроводного обновления прошивки
ota:
  - platform: esphome                 # Явно указываем платформу
    password: !secret OTA             # Пароль для OTA из секретов

# -------------------- НАСТРОЙКИ Wi-Fi --------------------
wifi:
  ssid: !secret wifi_ssid             # Имя сети из секретов
  password: !secret wifi_password     # Пароль сети из секретов
  # Режим точки доступа на случай, если Wi-Fi не подключится
  ap:
    ssid: !secret AP                  # Имя точки доступа из секретов
    password: "12345678"              # Пароль точки доступа

# Включаем портал для настройки Wi-Fi через веб-интерфейс
captive_portal:

# -------------------- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ --------------------
globals:
  # Время запуска устройства (в миллисекундах)
  - id: fan_start_time
    type: unsigned long
    restore_value: false               # Не сохраняем после перезагрузки
    initial_value: '0'                 # Начальное значение

  # Общее время работы вентилятора (в секундах)
  - id: fan_runtime_seconds
    type: int
    restore_value: true               # Сохраняем значение при перезагрузке
    initial_value: '0'                # Начальное значение

# -------------------- ДАТЧИКИ (СЕНСОРЫ) --------------------
sensor:
  # Основной сенсор времени работы (в секундах)
  - platform: template
    name: "Fan Runtime"               # Имя в Home Assistant
    id: fan_runtime                   # ID для ссылок в коде
    icon: "mdi:clock-outline"         # Иконка
    # Lambda-функция для вычисления времени
    lambda: |-
      unsigned long current = millis();                     # Текущее время
      unsigned long elapsed = (current - id(fan_start_time)) / 1000; # Секунд с запуска
      id(fan_runtime_seconds) = elapsed;                    # Сохраняем в глобальную переменную
      return elapsed;                                       # Возвращаем значение
    unit_of_measurement: "s"           # Единица измерения - секунды
    accuracy_decimals: 0               # Без десятичных знаков
    update_interval: 5s               # Обновлять каждые 5 секунд
    filters:
      - filter_out: nan                # Отфильтровывать нечисловые значения

  # Датчик уровня сигнала Wi-Fi
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s              # Обновлять каждую минуту

# -------------------- ТЕКСТОВЫЕ СЕНСОРЫ --------------------
text_sensor:
  # IP-адрес устройства
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      icon: "mdi:ip-network"

  # Версия прошивки ESPHome
  - platform: version
    name: "Firmware Version"
    icon: "mdi:chip"

# -------------------- КНОПКИ --------------------
button:
  # Кнопка перезагрузки устройства
  - platform: restart
    name: "Restart Fan"
    icon: "mdi:restart"

# -------------------- ПОЛЬЗОВАТЕЛЬСКИЙ КОМПОНЕНТ УПРАВЛЕНИЯ --------------------
# Основной компонент, реализующий логику работы вентилятора
custom_component:
  - id: fan_controller
    lambda: |-
      // Создаем экземпляр класса из файла fan_controller.h
      return {new FanController()};

# -------------------- ФОРМАТИРОВАННОЕ ВРЕМЯ РАБОТЫ --------------------
# Шаблон для отображения времени в днях, часах, минутах и секундах
template:
  - sensor:
      name: "Fan Runtime Formatted"       # Имя сенсора
      id: fan_runtime_formatted           # ID для ссылок
      icon: "mdi:clock-outline"          # Иконка
      # Lambda-функция для форматирования
      lambda: |-
        // Получаем общее время работы в секундах
        int total_seconds = id(fan_runtime_seconds);

        // Вычисляем дни, часы, минуты и секунды
        int days = total_seconds / 86400;                 // 86400 секунд в дне
        int hours = (total_seconds % 86400) / 3600;       // 3600 секунд в часе
        int minutes = (total_seconds % 3600) / 60;        // 60 секунд в минуте
        int seconds = total_seconds % 60;                 // Остаток - секунды

        // Буфер для строки
        char buffer[32];

        // Форматируем в зависимости от величины
        if (days > 0) {
          // Если есть дни - показываем дни, часы, минуты
          snprintf(buffer, sizeof(buffer), "%dd %02dh %02dm", days, hours, minutes);
        } else if (hours > 0) {
          // Если есть часы - показываем часы, минуты, секунды
          snprintf(buffer, sizeof(buffer), "%dh %02dm %02ds", hours, minutes, seconds);
        } else if (minutes > 0) {
          // Если есть минуты - показываем минуты и секунды
          snprintf(buffer, sizeof(buffer), "%dm %02ds", minutes, seconds);
        } else {
          // Иначе только секунды
          snprintf(buffer, sizeof(buffer), "%ds", seconds);
        }

        // Возвращаем строку с отформатированным временем
        return std::string(buffer);
      update_interval: 5s                # Обновление каждые 5 секунд
