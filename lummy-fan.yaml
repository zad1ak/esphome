esphome:
  name: lummy-fan
  friendly_name: Lummy Fan
  comment: "LU-FN105 Smart Fan"
  includes:
    - fan_controller.h
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(fan_start_time) = millis();

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret API

ota:
  password: !secret OTA

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret AP
    password: "12345678"

captive_portal:

# Время работы - переменная
globals:
  - id: fan_start_time
    type: unsigned long
    restore_value: false
    initial_value: '0'
  - id: fan_runtime_seconds
    type: int
    restore_value: true
    initial_value: '0'

# Сенсоры
sensor:
  # Сенсор времени работы
  - platform: template
    name: "Fan Runtime"
    id: fan_runtime
    icon: "mdi:clock-outline"
    lambda: |-
      unsigned long current = millis();
      unsigned long elapsed = (current - id(fan_start_time)) / 1000;
      id(fan_runtime_seconds) = elapsed;
      return elapsed;
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 5s
    filters:
      - filter_out: nan

  # Wi-Fi Signal
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  # IP адрес
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      icon: "mdi:ip-network"
  # Версия прошивки
  - platform: version
    name: "Firmware Version"
    icon: "mdi:chip"

# Кнопка перезагрузки
button:
  - platform: restart
    name: "Restart Fan"
    icon: "mdi:restart"

# Пользовательский компонент для управления вентилятором
custom_component:
  - id: fan_controller
    lambda: |-
      class FanController : public Component {
        public:
          void setup() override {
            pinMode(D1, OUTPUT); // Mode LED
            pinMode(D2, OUTPUT); // Timer LED
            pinMode(D3, OUTPUT); // Speed LED
            pinMode(D4, OUTPUT); // Fan motor control - IN1
            pinMode(D5, OUTPUT); // Fan motor control - IN2
            pinMode(D6, OUTPUT); // Fan motor control - PWM (EN)
            
            // Настройка кнопок как входов с подтяжкой
            pinMode(D7, INPUT_PULLUP); // Mode button
            pinMode(D8, INPUT_PULLUP); // Timer button
            pinMode(D0, INPUT_PULLUP); // On/Speed button
            // Off button на аналоговом пине A0
            pinMode(A0, INPUT_PULLUP);
            
            // Инициализация
            digitalWrite(D4, LOW);
            digitalWrite(D5, LOW);
            digitalWrite(D6, LOW);
            current_speed = SPEED_OFF;
            current_mode = MODE_NORMAL;
            timer_minutes = 0;
            last_button_time = 0;
            
            // Настройка таймера для прерываний
            timer1_attachInterrupt(timerCallback);
            timer1_enable(TIM_DIV16, TIM_EDGE, TIM_LOOP);
            timer1_write(500000); // 0.5 секунды
          }

          void loop() override {
            // Обработка кнопок с антидребезгом
            if (millis() - last_button_time > 200) {
              if (digitalRead(D7) == LOW) handleModeButton();
              if (digitalRead(D8) == LOW) handleTimerButton();
              if (digitalRead(D0) == LOW) handleSpeedButton();
              if (digitalRead(A0) == LOW) handleOffButton();
            }
            
            // Обновление состояния вентилятора
            updateFan();
          }

        private:
          enum Speed { SPEED_OFF, SPEED_LOW, SPEED_MEDIUM, SPEED_HIGH };
          enum Mode { MODE_NORMAL, MODE_BREEZE, MODE_OFF };
          
          Speed current_speed = SPEED_OFF;
          Mode current_mode = MODE_NORMAL;
          int timer_minutes = 0;
          unsigned long last_button_time = 0;
          unsigned long last_breeze_change = 0;
          bool breeze_slow = false;
          int breeze_counter = 0;
          unsigned long timer_end = 0;
          bool timer_active = false;
          
          static void timerCallback() {
            // Функция для таймера
            if (id(fan_controller)->timer_active) {
              // Проверка окончания таймера
            }
          }
          
          void handleModeButton() {
            last_button_time = millis();
            if (current_speed == SPEED_OFF) return;
            
            switch (current_mode) {
              case MODE_NORMAL:
                current_mode = MODE_BREEZE;
                breeze_counter = 0;
                break;
              case MODE_BREEZE:
                current_mode = MODE_OFF;
                current_speed = SPEED_OFF;
                stopFan();
                break;
              case MODE_OFF:
                current_mode = MODE_NORMAL;
                current_speed = SPEED_LOW;
                break;
            }
          }
          
          void handleTimerButton() {
            last_button_time = millis();
            if (current_speed == SPEED_OFF) return;
            
            // Цикл таймера: 0.5, 1, 1.5, 2, ... 7.5
            if (timer_minutes == 0) {
              timer_minutes = 30; // 0.5 часа = 30 минут
            } else if (timer_minutes < 450) {
              timer_minutes += 30; // +0.5 часа
            } else {
              timer_minutes = 0;
              timer_active = false;
            }
            
            if (timer_minutes > 0) {
              timer_active = true;
              timer_end = millis() + (timer_minutes * 60000);
            }
          }
          
          void handleSpeedButton() {
            last_button_time = millis();
            if (current_speed == SPEED_OFF) {
              current_speed = SPEED_LOW;
              current_mode = MODE_NORMAL;
            } else {
              switch (current_speed) {
                case SPEED_LOW:
                  current_speed = SPEED_MEDIUM;
                  break;
                case SPEED_MEDIUM:
                  current_speed = SPEED_HIGH;
                  break;
                case SPEED_HIGH:
                  current_speed = SPEED_LOW;
                  break;
                default:
                  break;
              }
            }
          }
          
          void handleOffButton() {
            last_button_time = millis();
            current_speed = SPEED_OFF;
            current_mode = MODE_OFF;
            stopFan();
            timer_active = false;
            timer_minutes = 0;
          }
          
          void stopFan() {
            analogWrite(D6, 0);
            digitalWrite(D4, LOW);
            digitalWrite(D5, LOW);
          }
          
          void updateFan() {
            // Проверка таймера
            if (timer_active && millis() > timer_end) {
              timer_active = false;
              timer_minutes = 0;
              current_speed = SPEED_OFF;
              stopFan();
              return;
            }
            
            if (current_speed == SPEED_OFF) {
              stopFan();
              return;
            }
            
            // Управление скоростью
            int speed_value = 0;
            switch (current_speed) {
              case SPEED_LOW:
                speed_value = 170; // ~33% PWM
                break;
              case SPEED_MEDIUM:
                speed_value = 340; // ~67% PWM
                break;
              case SPEED_HIGH:
                speed_value = 512; // 100% PWM
                break;
              default:
                break;
            }
            
            // Режим BREEZE
            if (current_mode == MODE_BREEZE) {
              if (millis() - last_breeze_change > 2000) {
                last_breeze_change = millis();
                breeze_counter++;
                if (breeze_counter % 6 == 0) {
                  breeze_slow = !breeze_slow;
                }
                if (breeze_slow) {
                  speed_value = speed_value * 0.4; // Медленнее
                }
              }
            }
            
            // Включение мотора
            analogWrite(D6, speed_value);
            digitalWrite(D4, HIGH);
            digitalWrite(D5, LOW);
            
            // Обновление LED индикаторов
            digitalWrite(D1, current_mode != MODE_OFF ? HIGH : LOW);
            digitalWrite(D2, timer_active ? HIGH : LOW);
            digitalWrite(D3, current_speed != SPEED_OFF ? HIGH : LOW);
          }
      };
      
      return {new FanController()};

# Система сенсоров времени работы (отображение в днях, часах, минутах)
template:
  - sensor:
      name: "Fan Runtime Formatted"
      id: fan_runtime_formatted
      icon: "mdi:clock-outline"
      lambda: |-
        int total_seconds = id(fan_runtime_seconds);
        int days = total_seconds / 86400;
        int hours = (total_seconds % 86400) / 3600;
        int minutes = (total_seconds % 3600) / 60;
        int seconds = total_seconds % 60;
        char buffer[32];
        if (days > 0) {
          snprintf(buffer, sizeof(buffer), "%dd %02dh %02dm", days, hours, minutes);
        } else if (hours > 0) {
          snprintf(buffer, sizeof(buffer), "%dh %02dm %02ds", hours, minutes, seconds);
        } else if (minutes > 0) {
          snprintf(buffer, sizeof(buffer), "%dm %02ds", minutes, seconds);
        } else {
          snprintf(buffer, sizeof(buffer), "%ds", seconds);
        }
        return std::string(buffer);
      update_interval: 5s
