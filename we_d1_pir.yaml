# ============================================================
# ESPHome: Общая конфигурация Wemos D1 Mini + PIR HC-SR501
# Загружается с GitHub через packages
# 
# ⚠️ ВАЖНО: в этом файле НЕЛЬЗЯ использовать !secret!
# Все секреты (WiFi, API, OTA) должны быть в локальном файле.
# ============================================================

# --- Версия прошивки (меняйте при каждом обновлении!) ---
esphome:
  project:
    name: "zad1ak.we-d1-pir"
    version: "1.0.1"                  # <-- Обновил версию!

# --- Captive Portal (веб-настройка WiFi при сбое) ---
captive_portal:

# --- Веб-сервер (доступ по IP в браузере) ---
web_server:
  port: 80

# ============================================================
# КОМПОНЕНТЫ УСТРОЙСТВА
# ============================================================

# --- PIR датчик движения HC-SR501 ---
# Подключение:
#   VCC  -> 5V (или 3.3V)
#   GND  -> GND
#   OUT  -> D2 (GPIO4)
#
# ⚠️ На ESP8266 только GPIO16 поддерживает INPUT_PULLDOWN!
# PIR HC-SR501 имеет встроенную подтяжку, поэтому используем INPUT (без подтяжки)
binary_sensor:
  - platform: gpio
    pin: 
      number: GPIO4                   # D2 на Wemos D1 Mini
      mode: INPUT                     # <-- ИСПРАВЛЕНО: убран INPUT_PULLDOWN
      inverted: false
    name: "PIR Motion"
    device_class: motion              # Иконка движения в HA
    filters:
      - delayed_off: 5s               # Антидребезг 5 сек

  # --- Статус подключения устройства к сети ---
  - platform: status
    name: "Device Status"
    entity_category: diagnostic

# --- Кнопка перезагрузки из Home Assistant ---
button:
  - platform: restart
    name: "Restart Device"
    entity_category: diagnostic

# --- Сенсоры ---
sensor:
  # Время работы с момента включения (timestamp)
  - platform: uptime
    name: "Uptime"
    type: timestamp
    entity_category: diagnostic

  # Уровень WiFi сигнала (RSSI)
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    unit_of_measurement: "dBm"
    entity_category: diagnostic

# --- Текстовые сенсоры (информация о сети и прошивке) ---
text_sensor:
  # Имя WiFi сети, IP, MAC
  - platform: wifi_info
    ssid:
      name: "WiFi SSID"
      entity_category: diagnostic
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

  # Версия ESPHome
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

  # Версия вашей прошивки (из project.version выше)
  - platform: template
    name: "Firmware Version"
    lambda: |-
      return {"1.0.1"};               # <-- Обновил версию!
    update_interval: never
    entity_category: diagnostic

# ============================================================
# ЗДЕСЬ МОЖНО ДОБАВЛЯТЬ НОВЫЕ ДАТЧИКИ
# ============================================================
