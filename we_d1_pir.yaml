# ============================================================
# ESPHome: Общая конфигурация Wemos D1 Mini + PIR HC-SR501
# Загружается с GitHub через packages
# ============================================================

esphome:
  project:
    name: "zad1ak.we-d1-pir"
    version: "1.0.3"                  # <-- Обновил версию

captive_portal:

web_server:
  port: 80

# ============================================================
# КОМПОНЕНТЫ УСТРОЙСТВА
# ============================================================

binary_sensor:
  # --- PIR датчик движения HC-SR501 ---
  # Подключение: VCC->5V, GND->GND, OUT->D2(GPIO4)
  # На ESP8266 только GPIO16 поддерживает INPUT_PULLDOWN!
  # PIR имеет встроенную подтяжку — используем INPUT
  - platform: gpio
    pin: 
      number: GPIO4
      mode: INPUT
      inverted: false
    name: "PIR Motion"
    device_class: motion
    filters:
      - delayed_off: 5s

  # --- Статус подключения устройства к сети ---
  - platform: status
    name: "Device Status"
    entity_category: diagnostic

button:
  # --- Кнопка перезагрузки из Home Assistant ---
  - platform: restart
    name: "Restart Device"
    entity_category: diagnostic

sensor:
  # --- Время работы в секундах (используется для расчёта формата) ---
  # id нужен, чтобы text_sensor мог прочитать значение
  - platform: uptime
    id: uptime_sensor
    name: "Uptime Seconds"
    update_interval: 10s
    internal: true                    # Скрыт из HA, используется только внутри
    entity_category: diagnostic

  # --- Уровень WiFi сигнала (RSSI) ---
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    unit_of_measurement: "dBm"
    entity_category: diagnostic

text_sensor:
  # --- Информация о WiFi сети ---
  - platform: wifi_info
    ssid:
      name: "WiFi SSID"
      entity_category: diagnostic
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

  # --- Версия ESPHome ---
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

  # --- Версия вашей прошивки ---
  - platform: template
    name: "Firmware Version"
    lambda: |-
      return {"1.0.3"};
    update_interval: never
    entity_category: diagnostic

  # --- Время работы в формате: Xд Yч Zм Wс ---
  # Берёт секунды из uptime_sensor и форматирует в читаемый вид
  - platform: template
    name: "Uptime"
    lambda: |-
      // Получаем секунды из сенсора uptime
      int total = (int) id(uptime_sensor).state;
      
      // Расчёт дней, часов, минут, секунд
      int days = total / 86400;
      total %= 86400;
      int hours = total / 3600;
      total %= 3600;
      int minutes = total / 60;
      int seconds = total % 60;
      
      // Формируем строку: "2д 5ч 30м 15с"
      char buf[32];
      snprintf(buf, sizeof(buf), "%dd %dh %dm %ds", days, hours, minutes, seconds);
      return {buf};
    update_interval: 10s
    entity_category: diagnostic
    icon: "mdi:timer-outline"

# ============================================================
# ЗДЕСЬ МОЖНО ДОБАВЛЯТЬ НОВЫЕ ДАТЧИКИ
# ============================================================
