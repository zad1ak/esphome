# ============================================================
# ESPHome конфигурация: Wemos D1 Mini + PIR HC-SR501
# Автор: zad1ak
# Версия: 1.0.0
# Дата: 2026-08-29
# ============================================================
# Описание:
#   - Управление PIR датчиком движения HC-SR501
#   - Мониторинг состояния WiFi, IP, uptime
#   - Удалённая перезагрузка через Home Assistant
#   - OTA обновления прошивки
# ============================================================

# --- Базовые настройки устройства ---
esphome:
  name: we-d1-pir                    # Уникальное имя устройства в сети (без пробелов, только lowercase)
  friendly_name: "Wemos D1 PIR"      # Человекочитаемое имя (отображается в HA)
  
  # Версия прошивки — меняйте при каждом обновлении кода на GitHub
  # Это позволит отслеживать, какая версия кода загружена на устройство
  project:
    name: "zad1ak.we-d1-pir"
    version: "1.0.0"

# --- Платформа ---
esp8266:
  board: d1_mini                     # Wemos D1 Mini на базе ESP8266
  framework:
    version: recommended             # Использовать рекомендуемую версию SDK

# --- Логирование (для отладки через USB/Serial) ---
logger:
  level: DEBUG                       # Уровень логов: DEBUG, INFO, WARN, ERROR

# --- API подключение к Home Assistant ---
api:
  encryption:
    key: !secret API                 # Ключ шифрования API (хранится в secrets.yaml)
  reboot_timeout: 15min              # Перезагрузка, если нет связи с HA 15 минут

# --- OTA (Over-The-Air) обновления по WiFi ---
ota:
  - platform: esphome
    password: !secret OTA            # Пароль для OTA обновлений (хранится в secrets.yaml)

# --- WiFi подключение ---
wifi:
  ssid: !secret wifi_ssid            # Имя WiFi сети из secrets.yaml
  password: !secret wifi_password    # Пароль WiFi из secrets.yaml
  
  # Режим точки доступа (AP) на случай если не удалось подключиться к WiFi
  ap:
    ssid: "we-d1-pir Fallback"       # Имя резервной точки доступа
    password: !secret AP             # Пароль для AP режима из secrets.yaml

# --- Captive Portal (веб-интерфейс для настройки WiFi) ---
captive_portal:

# --- Веб-сервер (доступ к устройству через браузер по IP) ---
web_server:
  port: 80                           # Порт веб-интерфейса

# ============================================================
# СЕНСОРЫ И КОМПОНЕНТЫ
# ============================================================

# --- PIR датчик движения HC-SR501 ---
# Подключение:
#   VCC  -> 3.3V или 5V (Wemos D1 Mini толерантен к 5V на GPIO)
#   GND  -> GND
#   OUT  -> D2 (GPIO4) — цифровой вход
binary_sensor:
  - platform: gpio
    pin: 
      number: GPIO4                   # Пин D2 на Wemos D1 Mini
      mode: INPUT_PULLDOWN            # Внутренняя подтяжка к GND (PIR выдаёт HIGH при движении)
      inverted: false                 # Не инвертируем сигнал
    name: "PIR Motion"                # Имя сенсора в Home Assistant
    device_class: motion              # Класс устройства — движение (иконка в HA)
    filters:
      - delayed_off: 5s               # Задержка сброса состояния на 5 секунд (антидребезг)

# --- Кнопка перезагрузки устройства из Home Assistant ---
button:
  - platform: restart
    name: "Restart Device"            # Кнопка перезагрузки в интерфейсе HA
    entity_category: diagnostic       # Категория — диагностика (скрыто в основном интерфейсе)

# --- Сенсоры состояния устройства ---
sensor:
  # --- Uptime — время работы устройства с момента последней перезагрузки ---
  - platform: uptime
    name: "Uptime"
    type: timestamp                   # Показывать как timestamp (когда было включено)
    entity_category: diagnostic

  # --- RSSI — мощность сигнала WiFi ---
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s              # Обновление каждую минуту
    unit_of_measurement: "dBm"
    entity_category: diagnostic

  # --- Здесь можно добавлять дополнительные сенсоры ---
  # Примеры для будущего расширения:
  # 
  # - platform: dht                    # DHT11/DHT22 температуры и влажности
  #   pin: GPIO5                        # D1
  #   temperature:
  #     name: "Room Temperature"
  #   humidity:
  #     name: "Room Humidity"
  #
  # - platform: adc                    # Аналоговый вход (A0)
  #   name: "Analog Value"
  #
  # - platform: bh1750                 # Датчик освещённости (I2C)
  #   name: "Illuminance"
  #
  # - platform: bmp280                 # Датчик давления и температуры (I2C)
  #   temperature:
  #     name: "BMP Temperature"
  #   pressure:
  #     name: "Pressure"

# --- Текстовые сенсоры (информация о сети и прошивке) ---
text_sensor:
  # --- Имя подключённой WiFi сети ---
  - platform: wifi_info
    ssid:
      name: "WiFi SSID"
      entity_category: diagnostic

  # --- IP адрес устройства ---
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

  # --- MAC адрес устройства ---
  - platform: wifi_info
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

  # --- Версия прошивки ESPHome ---
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

  # --- Версия кода (из project.version выше) ---
  - platform: template
    name: "Firmware Version"
    lambda: |-
      return {"1.0.0"};
    update_interval: never            # Обновляется только при перезагрузке
    entity_category: diagnostic

# --- Статус WiFi подключения ---
binary_sensor:
  # PIR датчик (определён выше)
  - platform: gpio
    pin: 
      number: GPIO4
      mode: INPUT_PULLDOWN
    name: "PIR Motion"
    device_class: motion
    filters:
      - delayed_off: 5s

  # --- Статус подключения к WiFi ---
  - platform: status
    name: "Device Status"
    entity_category: diagnostic

# ============================================================
# КОНЕЦ КОНФИГУРАЦИИ
# ============================================================
