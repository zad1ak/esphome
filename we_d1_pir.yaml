# ============================================================
# ESPHome: Общая конфигурация Wemos D1 Mini + PIR HC-SR501
# Загружается с GitHub через packages
# ============================================================

esphome:
  project:
    name: "zad1ak.we-d1-pir"
    version: "1.0.2"                  # <-- Обновил версию

captive_portal:

web_server:
  port: 80

# ============================================================
# КОМПОНЕНТЫ УСТРОЙСТВА
# ============================================================

binary_sensor:
  # --- PIR датчик движения HC-SR501 ---
  # Подключение: VCC->5V, GND->GND, OUT->D2(GPIO4)
  # На ESP8266 только GPIO16 поддерживает INPUT_PULLDOWN!
  # PIR имеет встроенную подтяжку — используем INPUT
  - platform: gpio
    pin: 
      number: GPIO4
      mode: INPUT
      inverted: false
    name: "PIR Motion"
    device_class: motion
    filters:
      - delayed_off: 5s

  # --- Статус подключения устройства к сети ---
  - platform: status
    name: "Device Status"
    entity_category: diagnostic

button:
  # --- Кнопка перезагрузки из Home Assistant ---
  - platform: restart
    name: "Restart Device"
    entity_category: diagnostic

sensor:
  # --- Время работы с момента включения (в секундах) ---
  # ⚠️ type: timestamp требует компонент time — убрано для простоты
  - platform: uptime
    name: "Uptime"
    # type: timestamp        # <-- УБРАНО! Иначе нужен компонент time
    update_interval: 60s
    entity_category: diagnostic

  # --- Уровень WiFi сигнала (RSSI) ---
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    unit_of_measurement: "dBm"
    entity_category: diagnostic

text_sensor:
  # --- Информация о WiFi сети ---
  - platform: wifi_info
    ssid:
      name: "WiFi SSID"
      entity_category: diagnostic
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

  # --- Версия ESPHome ---
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

  # --- Версия вашей прошивки ---
  - platform: template
    name: "Firmware Version"
    lambda: |-
      return {"1.0.2"};
    update_interval: never
    entity_category: diagnostic

# ============================================================
# ЗДЕСЬ МОЖНО ДОБАВЛЯТЬ НОВЫЕ ДАТЧИКИ
# ============================================================
